server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # /api/* goes to the backend without the /api prefix.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # SSE: send chunks to the browser immediately and keep long answers open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
